name: Profile stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/stats.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Johannesburg
          config_display: large
          config_theme: dark
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_lines: yes
          extras_css: |
            * { font-family: 'Inter', 'Segoe UI', sans-serif !important; }
            .container, .card, .field { background: #1a1815 !important; }
            h1, h2, .field b, .title { color: #c9a24a !important; }
            body, .field, p, div, span { color: #e8dcc4 !important; }
            .icon, svg { color: #e8b87d !important; fill: #e8b87d !important; }
            .border, hr { border-color: #c9a24a33 !important; }

      - name: Generate activity graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/activity.svg
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          config_timezone: Africa/Johannesburg
          config_theme: dark
          config_display: large
          extras_css: |
            * { font-family: 'Inter', 'Segoe UI', sans-serif !important; }
            .container, .card { background: #1a1815 !important; }
            h1, h2 { color: #c9a24a !important; }
            body, .field { color: #e8dcc4 !important; }

      - name: Generate trophies
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/trophies.svg
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          config_timezone: Africa/Johannesburg
          config_theme: dark
          config_display: large
          extras_css: |
            * { font-family: 'Inter', 'Segoe UI', sans-serif !important; }
            .container, .card { background: #1a1815 !important; }
            h1, h2 { color: #c9a24a !important; }
            body, .field { color: #e8dcc4 !important; }

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push

